<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dorset Rewires - Content editor</title>
</head>
<body>
  <script>
  // Debug overlay - shows state without needing DevTools. Remove once auth works.
  (function () {
    function showDebug(line) {
      var box = document.getElementById('dr-oauth-debug');
      if (!box) {
        box = document.createElement('div');
        box.id = 'dr-oauth-debug';
        box.style.cssText = 'position:fixed;bottom:12px;right:12px;background:#111;color:#0f0;padding:10px 14px;z-index:999999;font:12px/1.6 monospace;border-radius:4px;max-width:360px';
        document.body.appendChild(box);
      }
      box.innerHTML += line + '<br>';
    }

    showDebug('1. BC listener created');

    var bc = new BroadcastChannel('decap-oauth-relay');
    bc.addEventListener('message', function (event) {
      bc.close();
      showDebug('2. BC message received');
      showDebug('   data: ' + event.data.slice(0, 40) + '...');

      var syntheticEvent = new MessageEvent('message', {
        data: event.data,
        origin: 'https://dorset-rewires-oauth.silent-star-0bcc.workers.dev',
      });

      showDebug('3. Dispatching synthetic event');
      window.dispatchEvent(syntheticEvent);
      showDebug('4. Dispatched - waiting for Decap');
    });
  })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>

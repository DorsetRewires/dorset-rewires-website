<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dorset Rewires - Content editor</title>
</head>
<body>
  <script>
  // Debug overlay - shows state without needing DevTools. Remove once auth works.
  (function () {
    function showDebug(line) {
      var box = document.getElementById('dr-oauth-debug');
      if (!box) {
        box = document.createElement('div');
        box.id = 'dr-oauth-debug';
        box.style.cssText = 'position:fixed;bottom:12px;right:12px;background:#111;color:#0f0;padding:10px 14px;z-index:999999;font:12px/1.6 monospace;border-radius:4px;max-width:360px';
        document.body.appendChild(box);
      }
      box.innerHTML += line + '<br>';
    }

    showDebug('1. BC listener created');

    var WORKER_ORIGIN = 'https://dorset-rewires-oauth.silent-star-0bcc.workers.dev';

    function dispatchToDecap(dataString) {
      window.dispatchEvent(new MessageEvent('message', {
        data: dataString,
        origin: WORKER_ORIGIN,
      }));
    }

    var bc = new BroadcastChannel('decap-oauth-relay');
    bc.addEventListener('message', function (event) {
      bc.close();
      showDebug('2. BC message received');

      // Decap uses a two-step handshake. The listener that accepts the token
      // is only registered AFTER it receives "authorizing:github". So we send
      // the handshake first, then the real token message.
      showDebug('3. Sending handshake');
      dispatchToDecap('authorizing:github');

      showDebug('4. Sending token');
      dispatchToDecap(event.data);

      showDebug('5. Done - Decap should advance');
    });
  })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>

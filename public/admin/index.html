<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dorset Rewires - Content editor</title>
</head>
<body>
  <script>
  // Receives the OAuth token from relay.html via BroadcastChannel and feeds it
  // to Decap CMS. GitHub's COOP policy clears window.opener during the OAuth
  // redirect, so the normal popup postMessage flow fails silently. Instead the
  // worker redirects the popup to relay.html (same origin), which broadcasts the
  // token here. Decap uses a two-step handshake: it only registers its token
  // listener AFTER receiving "authorizing:github", so we send the handshake
  // first, then the real token message.
  (function () {
    var WORKER_ORIGIN = 'https://dorset-rewires-oauth.silent-star-0bcc.workers.dev';

    function dispatchToDecap(dataString) {
      window.dispatchEvent(new MessageEvent('message', {
        data: dataString,
        origin: WORKER_ORIGIN,
      }));
    }

    var bc = new BroadcastChannel('decap-oauth-relay');
    bc.addEventListener('message', function (event) {
      bc.close();
      dispatchToDecap('authorizing:github');
      dispatchToDecap(event.data);
    });
  })();
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>

# Decap CMS config for Dorset Rewires - LIVE (working since 2026-06-08).
#
# Auth uses a self-hosted GitHub OAuth proxy, NOT Decap's default Netlify proxy:
# the base_url below points to the dr-oauth-worker (a Cloudflare Worker).
#
# The GitHub OAuth App's Authorization callback URL must be the WORKER callback:
#   https://dorset-rewires-oauth.silent-star-0bcc.workers.dev/callback
# It is NOT https://dorsetrewires.co.uk/admin/ - that was the early, abandoned
# approach (GitHub OAuth Apps do not support PKCE, so the worker proxy is required).
#
# The GitHub Client Secret is stored as a Worker secret, never in this file.
# The login flow works around GitHub's COOP policy via a same-origin BroadcastChannel
# relay - see admin/index.html and admin/relay.html for how the token gets back to the CMS.
# Reach the editor at https://dorsetrewires.co.uk/admin/ (keep the trailing slash).

backend:
  name: github
  repo: DorsetRewires/dorset-rewires-website
  branch: main
  base_url: https://dorset-rewires-oauth.silent-star-0bcc.workers.dev

media_folder: public/assets/img
public_folder: /assets/img

collections:
  # Reviews - edit the customer reviews shown on the site
  - name: reviews
    label: Customer reviews
    files:
      - name: all-reviews
        label: All reviews
        file: public/reviews.json
        format: json
        fields:
          - label: Overall rating
            name: aggregate
            widget: object
            fields:
              - { label: Star rating (e.g. 4.9), name: rating, widget: number, value_type: float, min: 1, max: 5, step: 0.1 }
              - { label: Total review count, name: count, widget: number }
              - { label: Review source (e.g. Google), name: source, widget: string }
          - label: Reviews
            name: reviews
            widget: list
            fields:
              # required: false is DELIBERATE (2026-07-19). Decap treats fields as
              # required by default, and no review has ever had an id - not the ones
              # added by hand, nor the ones google-reviews-poll.py commits daily.
              # Without this the editor demanded an invented ID before it would save.
              - { label: ID (optional, unused), name: id, widget: string, required: false }
              - { label: Star rating, name: stars, widget: number, min: 1, max: 5 }
              - { label: Reviewer name, name: author, widget: string }
              # Also required: false - Google reviews often carry no location, and
              # two of the five live reviews have location "" (2026-07-19).
              - { label: Location (e.g. Bournemouth, Winton), name: location, widget: string, required: false }
              - { label: Date (e.g. March 2026), name: date, widget: string }
              - { label: Source (e.g. Google), name: source, widget: string }
              - { label: Review text, name: body, widget: text }

  # Homepage content - NEEDS SETUP FIRST
  # Before enabling this, homepage copy must be extracted to public/data/site-content.json
  # and index.html must read from that file. Ask Claude to do this when ready.
  #
  # - name: homepage
  #   label: Homepage
  #   files:
  #     - name: site-content
  #       label: Site content
  #       file: public/data/site-content.json
  #       format: json
  #       fields:
  #         - { label: Hero heading, name: hero_heading, widget: string }
  #         - { label: Hero subheading, name: hero_subheading, widget: text }
